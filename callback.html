<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TikTok Auth Callback</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 60px auto; padding: 20px; }
    code { background: #f4f4f4; padding: 10px; display: block; word-break: break-all; border-radius: 4px; font-size: 14px; }
  </style>
</head>
<body>
  <h2>✅ TikTok Authorization Complete</h2>
  <p>Copy the <strong>code</strong> value below and send it to Claude:</p>
  <code id="code"></code>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code) {
      document.getElementById('code').textContent = code;
    } else {
      document.getElementById('code').textContent = 'No code found. Full URL: ' + window.location.href;
    }
  </script>
</body>
</html>
